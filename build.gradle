plugins {
  id 'java-library'
  alias(libs.plugins.publish.on.central)
  alias(libs.plugins.test.logger)
}


layout.buildDirectory = '.build'


group = 'de.sayayi.lib'
version = libs.versions.stage.runner.get()
description = 'Stage Runner Framework'


tasks.withType(JavaCompile).configureEach {
  javaCompiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(21)
  }

  sourceCompatibility = 21
  targetCompatibility = 21

  options.encoding = 'UTF-8'
}


tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }

  defaultCharacterEncoding = 'UTF-8'
}


compileTestJava {
  options.compilerArgs.add '-parameters'
}


repositories {
  maven {
    url = 'https://central.sonatype.com/repository/maven-snapshots/'

    mavenContent {
      includeGroup 'de.sayayi.lib'
      snapshotsOnly()
    }
  }

  mavenCentral()
}


java {
  withJavadocJar()
  withSourcesJar()
}


configurations {
  optionalImplementation {
    canBeConsumed = false
    canBeResolved = false
  }

  compileClasspath.extendsFrom optionalImplementation
  runtimeClasspath.extendsFrom optionalImplementation
  testCompileClasspath.extendsFrom optionalImplementation
  testRuntimeClasspath.extendsFrom optionalImplementation
}


test {
  useJUnitPlatform()
}


dependencies {
  // java
  compileOnlyApi libs.jetbrains.annotations

  optionalImplementation libs.spring.context
  optionalImplementation libs.byte.buddy


  // test
  testAnnotationProcessor libs.lombok
  testCompileOnly libs.lombok

  testImplementation libs.junit.jupiter
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation libs.spring.test
}


tasks.withType(Jar).configureEach {
  includeEmptyDirs = false
  preserveFileTimestamps = true
  reproducibleFileOrder = true

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': 'de.sayayi',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Created-By': System.getProperty('java.version'),
        'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
    )
  }

  from(rootDir) {
    include 'LICENSE'
    into 'META-INF'
    expand(
        copyright: new Date().format('yyyy'),
        version: project.version)
  }

  dependsOn test
}


javadoc.options.addStringOption('Xdoclint:none', '-quiet')


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}


def snapshot = version.toString().endsWith('-SNAPSHOT')
if (snapshot)
{
  publishing {
    repositories {
      maven {
        name = 'mavenCentralSnapshot'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'

        mavenContent {
          snapshotsOnly()
        }

        credentials {
          username = rootProject.findProperty('mavenCentralPortalUsername')
          password = rootProject.findProperty('mavenCentralPortalPassword')
        }
      }
    }
  }
}


publishOnCentral {
  repoOwner = 'jgremmen'

  afterEvaluate {
    projectLongName = "${project.description}"
  }
  projectDescription = 'Stage Runner Framework'

  licenseName = 'Apache License, Version 2.0'
  licenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0'
}


publishing {
  publications {
    withType(MavenPublication).configureEach {
      pom {
        inceptionYear = '2024'

        developers {
          developer {
            id = 'jgremmen'
            name = 'Jeroen Gremmen'
            email = 'jeroen.gremmen@sayayi.de'
          }
        }

        withXml {
          def dependenciesNode = asNode()['dependencies'][0]

          configurations.optionalImplementation.allDependencies.each { dep ->
            def node = dependenciesNode.appendNode('dependency')

            node.appendNode('groupId', dep.group)
            node.appendNode('artifactId', dep.name)
            node.appendNode('version', dep.version)
            node.appendNode('optional', 'true')
          }
        }
      }
    }
  }
}


tasks.register('release') {
  group = 'release'
  description = "Release ${project.name} ${snapshot ? 'snapshot ' : ''}artifacts to Maven Central Repository."

  inputs.property('snapshot', snapshot)

  if (snapshot)
    dependsOn ':message-format:publishOSSRHPublicationToMavenCentralSnapshotRepository'
  else
  {
    dependsOn 'publishOSSRHPublicationToProjectLocalRepository'
    dependsOn 'zipMavenCentralPortalPublication'
    dependsOn 'validateMavenCentralPortalPublication'
    dependsOn 'releaseMavenCentralPortalPublication'
  }
}


clean {
  delete layout.projectDirectory.dir('build')
}


wrapper {
  distributionType = Wrapper.DistributionType.BIN
}
